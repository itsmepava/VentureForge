openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VentureForge investment sourcing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Sourcing dashboard summaries and activity
  - name: companies
    description: Enriched company discovery records
  - name: saved-searches
    description: Saved sourcing filters
  - name: portfolio
    description: Portfolio source ingestion
  - name: integrations
    description: Protected provider connections and delivery destinations
  - name: billing
    description: Stripe subscription status and billing portal
paths:
  /sourcing:
    {
      "get":
        {
          "operationId": "getSourcingDesk",
          "tags": ["sourcing"],
          "responses":
            {
              "200":
                {
                  "description": "Sourcing response",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/SourcingDesk" },
                        },
                    },
                },
              "400": { "description": "Invalid input" },
              "404": { "description": "Record not found" },
            },
        },
    }
  /sourcing/mandates:
    {
      "post":
        {
          "operationId": "createSourcingMandate",
          "tags": ["sourcing"],
          "responses":
            {
              "201":
                {
                  "description": "Sourcing response",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/SourcingMandate" },
                        },
                    },
                },
              "400": { "description": "Invalid input" },
              "404": { "description": "Record not found" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/SourcingMandateInput" },
                    },
                },
            },
        },
    }
  /sourcing/mandates/{id}:
    {
      "patch":
        {
          "operationId": "updateSourcingMandate",
          "tags": ["sourcing"],
          "responses":
            {
              "200":
                {
                  "description": "Sourcing response",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/SourcingMandate" },
                        },
                    },
                },
              "400": { "description": "Invalid input" },
              "404": { "description": "Record not found" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        { "$ref": "#/components/schemas/SourcingMandateInput" },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
        },
    }
  /sourcing/mandates/{id}/scan:
    {
      "post":
        {
          "operationId": "startSourcingScan",
          "tags": ["sourcing"],
          "responses":
            {
              "202":
                {
                  "description": "Sourcing response",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/SourcingRun" },
                        },
                    },
                },
              "400": { "description": "Invalid input" },
              "404": { "description": "Record not found" },
            },
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
        },
    }
  /sourcing/provider:
    {
      "put":
        {
          "operationId": "saveSourcingProvider",
          "tags": ["sourcing"],
          "responses":
            {
              "200":
                {
                  "description": "Sourcing response",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/SourcingProvider" },
                        },
                    },
                },
              "400": { "description": "Invalid input" },
              "404": { "description": "Record not found" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "$ref": "#/components/schemas/SourcingProviderInput",
                        },
                    },
                },
            },
        },
      "delete":
        {
          "operationId": "deleteSourcingProvider",
          "tags": ["sourcing"],
          "responses":
            {
              "204": { "description": "Sourcing response" },
              "400": { "description": "Invalid input" },
              "404": { "description": "Record not found" },
            },
        },
    }
  /sourcing/prospects/{id}:
    {
      "patch":
        {
          "operationId": "updateSourcingProspect",
          "tags": ["sourcing"],
          "responses":
            {
              "200":
                {
                  "description": "Sourcing response",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/SourcingProspect" },
                        },
                    },
                },
              "400": { "description": "Invalid input" },
              "404": { "description": "Record not found" },
            },
          "requestBody":
            {
              "required": true,
              "content":
                {
                  "application/json":
                    {
                      "schema":
                        {
                          "$ref": "#/components/schemas/SourcingProspectInput",
                        },
                    },
                },
            },
          "parameters":
            [
              {
                "name": "id",
                "in": "path",
                "required": true,
                "schema": { "type": "string" },
              },
            ],
        },
    }
  /sourcing/export.csv:
    {
      "get":
        {
          "operationId": "exportSourcingProspects",
          "tags": ["sourcing"],
          "responses":
            {
              "200":
                {
                  "description": "CSV export of all stored prospects",
                  "content": { "text/csv": { "schema": { "type": "string" } } },
                },
            },
        },
    }
  /repository-research:
    get:
      operationId: listRepositoryResearch
      tags: [companies]
      summary: List saved GitHub research
      responses:
        "200":
          description: Saved research
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RepositoryResearch"
    post:
      operationId: researchGitHubRepository
      tags: [companies]
      summary: Fetch live GitHub evidence and save it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryResearchInput"
      responses:
        "200":
          description: Research saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepositoryResearch"
  /organization:
    get:
      operationId: getOrganization
      tags: [dashboard]
      summary: Get current workspace preferences
      responses:
        "200":
          description: Workspace preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPreferences"
    patch:
      operationId: updateOrganization
      tags: [dashboard]
      summary: Save workspace preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationPreferences"
      responses:
        "200":
          description: Saved workspace preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPreferences"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get sourcing dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent sourcing activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List enriched company records
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/RegionQuery"
        - $ref: "#/components/parameters/CountryQuery"
        - $ref: "#/components/parameters/StageQuery"
        - $ref: "#/components/parameters/BusinessModelQuery"
        - $ref: "#/components/parameters/SectorQuery"
      responses:
        "200":
          description: Filtered company records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiscoveredCompany"
  /companies/{companyId}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company profile
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveredCompany"
        "404":
          description: Company not found
  /companies/export.csv:
    get:
      operationId: exportCompaniesCsv
      tags: [companies]
      summary: Export filtered companies as CSV
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/RegionQuery"
        - $ref: "#/components/parameters/CountryQuery"
        - $ref: "#/components/parameters/StageQuery"
        - $ref: "#/components/parameters/BusinessModelQuery"
        - $ref: "#/components/parameters/SectorQuery"
      responses:
        "200":
          description: CSV company export
          content:
            text/csv:
              schema:
                type: string
                format: binary
  /companies/export.pdf:
    get:
      operationId: exportCompaniesPdf
      tags: [companies]
      summary: Export filtered companies as PDF
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/RegionQuery"
        - $ref: "#/components/parameters/CountryQuery"
        - $ref: "#/components/parameters/StageQuery"
        - $ref: "#/components/parameters/BusinessModelQuery"
        - $ref: "#/components/parameters/SectorQuery"
      responses:
        "200":
          description: PDF company export
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /companies/{companyId}/github-repositories:
    get:
      operationId: listCompanyGitHubRepositories
      tags: [companies]
      summary: List verified GitHub repositories for a company
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      responses:
        "200":
          description: Company repository mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitHubRepository"
        "404":
          description: Company not found
    post:
      operationId: addCompanyGitHubRepository
      tags: [companies]
      summary: Verify and add a GitHub repository mapping
      parameters:
        - $ref: "#/components/parameters/CompanyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubRepositoryInput"
      responses:
        "201":
          description: Verified repository mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepository"
        "400":
          description: Repository could not be verified
        "404":
          description: Company not found
        "503":
          description: GitHub is not connected
  /companies/{companyId}/github-repositories/{repositoryId}:
    delete:
      operationId: deleteCompanyGitHubRepository
      tags: [companies]
      summary: Remove a GitHub repository mapping
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/RepositoryId"
      responses:
        "204":
          description: Repository mapping removed
        "404":
          description: Repository mapping not found
  /companies/{companyId}/github-repositories/{repositoryId}/verify:
    post:
      operationId: verifyCompanyGitHubRepository
      tags: [companies]
      summary: Retry GitHub repository access verification
      parameters:
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/RepositoryId"
      responses:
        "200":
          description: Updated repository verification state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubRepository"
        "404":
          description: Repository mapping not found
        "503":
          description: GitHub is not connected
  /saved-searches:
    get:
      operationId: listSavedSearches
      tags: [saved-searches]
      summary: List saved searches
      responses:
        "200":
          description: Saved searches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedSearch"
    post:
      operationId: createSavedSearch
      tags: [saved-searches]
      summary: Save a sourcing search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchInput"
      responses:
        "201":
          description: Saved search
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
  /saved-searches/{searchId}:
    delete:
      operationId: deleteSavedSearch
      tags: [saved-searches]
      summary: Delete a saved search
      parameters:
        - $ref: "#/components/parameters/SearchId"
      responses:
        "204":
          description: Deleted
        "404":
          description: Saved search not found
  /portfolio-sources:
    get:
      operationId: listPortfolioSources
      tags: [portfolio]
      summary: List portfolio source links
      responses:
        "200":
          description: Portfolio sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioSource"
    post:
      operationId: createPortfolioSource
      tags: [portfolio]
      summary: Queue a portfolio link for scanning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortfolioSourceInput"
      responses:
        "201":
          description: Portfolio source queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioSource"
  /integrations:
    get:
      operationId: listIntegrations
      tags: [integrations]
      summary: List provider connection status
      responses:
        "200":
          description: Provider connection status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationConnection"
  /integrations/{provider}/vault:
    post:
      operationId: saveIntegrationVault
      tags: [integrations]
      summary: Save encrypted provider values
      parameters:
        - $ref: "#/components/parameters/Provider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationVaultInput"
      responses:
        "201":
          description: Saved provider connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationConnection"
        "400":
          description: Invalid provider values
        "503":
          description: Encryption is not configured
  /integrations/{provider}:
    delete:
      operationId: disconnectIntegration
      tags: [integrations]
      summary: Remove organization provider values
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "204":
          description: Disconnected
  /integrations/{provider}/verify:
    post:
      operationId: verifyIntegration
      tags: [integrations]
      summary: Verify an encrypted provider connection
      parameters:
        - $ref: "#/components/parameters/Provider"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationVerification"
        "404":
          description: Provider is not configured
  /integrations/{provider}/test-delivery:
    post:
      operationId: testIntegrationDelivery
      tags: [integrations]
      summary: Send a test delivery to a configured destination
      parameters:
        - $ref: "#/components/parameters/Provider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationDeliveryInput"
      responses:
        "200":
          description: Delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationDeliveryResponse"
        "404":
          description: Provider is not configured
  /billing/status:
    get:
      operationId: getBillingStatus
      tags: [billing]
      summary: Get organization billing status
      responses:
        "200":
          description: Billing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingStatus"
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a Stripe customer portal session
      responses:
        "200":
          description: Billing portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPortalResponse"
        "409":
          description: Organization has no Stripe customer
        "503":
          description: Stripe is not connected
  /stripe/webhook:
    post:
      operationId: stripeWebhook
      tags: [billing]
      summary: Receive a signed Stripe webhook
      responses:
        "200":
          description: Webhook accepted
        "400":
          description: Invalid signature or payload
components:
  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema:
        type: string
    SearchId:
      name: searchId
      in: path
      required: true
      schema:
        type: string
    RepositoryId:
      name: repositoryId
      in: path
      required: true
      schema:
        type: string
    Provider:
      name: provider
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ProviderName"
    SearchQuery:
      name: search
      in: query
      required: false
      schema:
        type: string
    RegionQuery:
      name: region
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    CountryQuery:
      name: country
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    StageQuery:
      name: stage
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    BusinessModelQuery:
      name: businessModel
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    SectorQuery:
      name: sector
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
  schemas:
    SourcingProspect:
      {
        "type": "object",
        "properties":
          {
            "id": { "type": "string" },
            "organization_id": { "type": "string" },
            "mandate_id": { "type": "string" },
            "run_id": { "type": "string" },
            "domain": { "type": "string" },
            "name": { "type": "string" },
            "dossier": { "$ref": "#/components/schemas/SourcingDossier" },
            "status": { "type": "string" },
            "notes": { "type": "string" },
            "discovered_at": { "type": "string" },
            "updated_at": { "type": "string" },
          },
        "required":
          [
            "id",
            "organization_id",
            "mandate_id",
            "run_id",
            "domain",
            "name",
            "dossier",
            "status",
            "notes",
            "discovered_at",
            "updated_at",
          ],
      }
    SourcingRun:
      {
        "type": "object",
        "properties":
          {
            "id": { "type": "string" },
            "organization_id": { "type": "string" },
            "mandate_id": { "type": "string" },
            "mandate_snapshot":
              { "$ref": "#/components/schemas/SourcingMandate" },
            "status": { "type": "string" },
            "progress": { "type": "string" },
            "evidence":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/SourcingEvidence" },
              },
            "search_calls": { "type": "number" },
            "model_calls": { "type": "number" },
            "tokens": { "type": "number" },
            "added": { "type": "number" },
            "duplicates": { "type": "number" },
            "errors": { "type": "array", "items": { "type": "string" } },
            "started_at": { "type": "string" },
            "finished_at": { "type": "string", "nullable": true },
          },
        "required":
          [
            "id",
            "organization_id",
            "mandate_id",
            "mandate_snapshot",
            "status",
            "progress",
            "evidence",
            "search_calls",
            "model_calls",
            "tokens",
            "added",
            "duplicates",
            "errors",
            "started_at",
            "finished_at",
          ],
      }
    SourcingMandate:
      {
        "type": "object",
        "properties":
          {
            "id": { "type": "string" },
            "organization_id": { "type": "string" },
            "name": { "type": "string" },
            "criteria": { "$ref": "#/components/schemas/SourcingCriteria" },
            "daily": { "type": "boolean" },
            "next_scan_at": { "type": "string", "nullable": true },
            "created_at": { "type": "string" },
          },
        "required":
          [
            "id",
            "organization_id",
            "name",
            "criteria",
            "daily",
            "next_scan_at",
            "created_at",
          ],
      }
    SourcingDossier:
      {
        "type": "object",
        "properties":
          {
            "name": { "type": "string" },
            "website": { "type": "string" },
            "facts":
              {
                "type": "object",
                "additionalProperties":
                  { "$ref": "#/components/schemas/SourcingFact" },
              },
            "checks":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/SourcingCheck" },
              },
            "evidence":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/SourcingEvidence" },
              },
            "ready": { "type": "boolean" },
            "gaps": { "type": "array", "items": { "type": "string" } },
            "researchedAt": { "type": "string" },
          },
        "required":
          [
            "name",
            "website",
            "facts",
            "checks",
            "evidence",
            "ready",
            "gaps",
            "researchedAt",
          ],
      }
    SourcingCheck:
      {
        "type": "object",
        "properties":
          {
            "criterion": { "type": "string" },
            "result":
              { "type": "string", "enum": ["match", "fail", "unknown"] },
            "sourceId": { "type": "string" },
            "quote": { "type": "string" },
          },
        "required": ["criterion", "result", "sourceId", "quote"],
      }
    SourcingFact:
      {
        "type": "object",
        "properties":
          {
            "value": { "type": "string" },
            "sourceId": { "type": "string" },
            "quote": { "type": "string" },
          },
        "required": ["value", "sourceId", "quote"],
      }
    SourcingEvidence:
      {
        "type": "object",
        "properties":
          {
            "id": { "type": "string" },
            "url": { "type": "string" },
            "title": { "type": "string" },
            "text": { "type": "string" },
            "publishedAt": { "type": "string", "nullable": true },
            "observedAt": { "type": "string" },
            "query": { "type": "string" },
          },
        "required":
          ["id", "url", "title", "text", "publishedAt", "observedAt", "query"],
      }
    SourcingCriteria:
      {
        "type": "object",
        "properties":
          {
            "geographies": { "type": "array", "items": { "type": "string" } },
            "sectors": { "type": "array", "items": { "type": "string" } },
            "stages": { "type": "array", "items": { "type": "string" } },
            "businessModels":
              { "type": "array", "items": { "type": "string" } },
